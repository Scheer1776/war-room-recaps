name: Recap data (for TikTok cuts)

# Publishes a week's recap data + headshots to the media branch without re-rendering
# the HD video. The weekly HD recap job publishes the same data automatically.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week number"
        required: true

permissions:
  contents: write

concurrency:
  group: recap
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - name: Publish recap data
        run: node render.mjs
        env:
          WARROOM_URL: https://war-room-self-one.vercel.app
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_ONLY: "1"
          WEEK: ${{ inputs.week }}
